name: workflow overview
 
on:
   workflow_dispatch:
   push:
    branches:
     - main
 
jobs:
 my_self_hosted_job:
  name: my self hosted job
  runs-on: self-hosted
  steps:
   - name: step 1 in self-hosted runner
     id: selfHostedId
     shell: cmd
     run: |
      echo this is a multiline comment
      echo and this job has been executed from my self-hosted runner
 a_simple_job:
  name: my simpla job name
  runs-on: ubuntu-latest
  steps:
   - name: name of my first step
     id: firstStepId
     run: echo "this is the first step from the first job"
   - name: step with another shell
     id: secondStepId
     shell: python
     run: print("this step is using python shell")
